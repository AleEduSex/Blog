[build]
  publish = "site"

# Gli indirizzi ufficiali del sito finiscono in .html (canonical, sitemap, link interni).
# Pretty URLs riscriverebbe i link al deploy e creerebbe due indirizzi per pagina: spento.
[build.processing.html]
  pretty_urls = false

# Chi arriva all'indirizzo senza .html va portato su quello ufficiale.
# force = true serve perché il file .html esiste: senza, Netlify ignorerebbe la regola.
# Una riga per articolo (Netlify non accetta il jolly a metà percorso): vedi PUBBLICARE.md passo 6b.
[[redirects]]
  from = "/legale"
  to = "/legale.html"
  status = 301
  force = true

